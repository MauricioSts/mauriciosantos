<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Cartão GLB</title>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
        import { GLTFExporter } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/exporters/GLTFExporter.js';

        window.addEventListener('DOMContentLoaded', () => {
            const scene = new THREE.Scene();
            
            // Criar geometria do cartão
            const cardGeometry = new THREE.BoxGeometry(1.6, 2.25, 0.02);
            
            // Carregar textura da foto de perfil
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load('/profile.jpeg', (texture) => {
                const cardMaterial = new THREE.MeshPhysicalMaterial({
                    map: texture,
                    roughness: 0.9,
                    metalness: 0.8,
                    clearcoat: 1,
                    clearcoatRoughness: 0.15
                });
                
                const card = new THREE.Mesh(cardGeometry, cardMaterial);
                card.name = 'card';
                scene.add(card);
                
                // Criar clipe metálico (topo)
                const clipGeometry = new THREE.CylinderGeometry(0.15, 0.15, 0.3, 16);
                const metalMaterial = new THREE.MeshStandardMaterial({
                    color: 0xcccccc,
                    metalness: 1,
                    roughness: 0.3
                });
                
                const clip = new THREE.Mesh(clipGeometry, metalMaterial);
                clip.rotation.z = Math.PI / 2;
                clip.position.y = 1.3;
                clip.name = 'clip';
                scene.add(clip);
                
                // Criar presilha
                const clampGeometry = new THREE.BoxGeometry(0.2, 0.1, 0.05);
                const clamp = new THREE.Mesh(clampGeometry, metalMaterial);
                clamp.position.y = 1.3;
                clamp.name = 'clamp';
                scene.add(clamp);
                
                // Exportar como GLB
                const exporter = new GLTFExporter();
                exporter.parse(
                    scene,
                    (gltf) => {
                        const blob = new Blob([gltf], { type: 'application/octet-stream' });
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = 'card.glb';
                        link.click();
                        document.getElementById('status').textContent = '✅ Arquivo card.glb gerado! Mova para src/assets/lanyard/';
                    },
                    (error) => {
                        console.error('Erro ao exportar:', error);
                        document.getElementById('status').textContent = '❌ Erro ao gerar arquivo';
                    },
                    { binary: true }
                );
            }, undefined, (error) => {
                console.error('Erro ao carregar textura:', error);
                document.getElementById('status').textContent = '❌ Erro ao carregar profile.jpeg';
            });
        });
    </script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #0a0a0a;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: #1a1a1a;
            border-radius: 1rem;
            border: 2px solid #34d399;
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.25);
        }
        h1 { color: #34d399; margin-bottom: 1rem; }
        #status { font-size: 1.2rem; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 Gerador de Cartão GLB</h1>
        <p>Gerando cartão com sua foto de perfil...</p>
        <div id="status">⏳ Processando...</div>
    </div>
</body>
</html>
